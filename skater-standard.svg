<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 300" fill="none">
  <!-- 简笔画小人 标准形态 - 简单友好版本 -->

  <!-- 滑板 -->
  <g id="skateboard">
    <!-- 滑板面 - 红色 -->
    <rect x="75" y="260" width="100" height="12" rx="6" fill="#FF3B30" stroke="#000000" stroke-width="2"/>
    <!-- 左轮 -->
    <circle cx="90" cy="272" r="8" fill="#000000"/>
    <!-- 右轮 -->
    <circle cx="160" cy="272" r="8" fill="#000000"/>
  </g>

  <!-- 腿部 - 两条直线 -->
  <line x1="115" y1="220" x2="105" y2="260" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
  <line x1="135" y1="220" x2="145" y2="260" stroke="#000000" stroke-width="8" stroke-linecap="round"/>

  <!-- 身体 - 圆形 -->
  <circle cx="125" cy="160" r="35" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>

  <!-- 左臂（挥手） - 两段线条 -->
  <line x1="100" y1="155" x2="60" y2="130" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  <line x1="60" y1="130" x2="50" y2="95" stroke="#000000" stroke-width="7" stroke-linecap="round"/>

  <!-- 右臂（放下） - 两段线条 -->
  <line x1="150" y1="155" x2="175" y2="175" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  <line x1="175" y1="175" x2="180" y2="195" stroke="#000000" stroke-width="7" stroke-linecap="round"/>

  <!-- 头部 - 圆形 -->
  <circle cx="125" cy="100" r="45" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>

  <!-- 左眼 -->
  <circle cx="110" cy="95" r="5" fill="#000000"/>

  <!-- 右眼 -->
  <circle cx="140" cy="95" r="5" fill="#000000"/>

  <!-- 嘴巴 - 开心微笑 -->
  <path d="M 105 115 Q 125 130 145 115" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
