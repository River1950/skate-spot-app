<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" fill="none">
  <!-- 简笔画滑手 - Ollie 跳跃姿态（参考真实滑板动作） -->

  <!-- 滑板（在空中，稍微倾斜） -->
  <g id="skateboard" transform="rotate(-15 140 240)">
    <!-- 滑板面 -->
    <rect x="80" y="235" width="120" height="12" rx="6" fill="#FF3B30" stroke="#000000" stroke-width="2"/>
    <!-- 左轮（绿色，参考图片） -->
    <circle cx="100" cy="241" r="8" fill="#34C759"/>
    <!-- 右轮（绿色） -->
    <circle cx="180" cy="241" r="8" fill="#34C759"/>
  </g>

  <!-- 左腿（弯曲，吸起） -->
  <g id="left-leg">
    <!-- 大腿 -->
    <line x1="125" y1="180" x2="95" y2="210" stroke="#000000" stroke-width="9" stroke-linecap="round"/>
    <!-- 小腿（向后弯曲） -->
    <line x1="95" y1="210" x2="90" y2="235" stroke="#000000" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- 右腿（弯曲，控板） -->
  <g id="right-leg">
    <!-- 大腿 -->
    <line x1="145" y1="180" x2="165" y2="215" stroke="#000000" stroke-width="9" stroke-linecap="round"/>
    <!-- 小腿（向前） -->
    <line x1="165" y1="215" x2="170" y2="240" stroke="#000000" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- 身体（前倾） -->
  <ellipse cx="135" cy="130" rx="32" ry="50" fill="#FFFFFF" stroke="#000000" stroke-width="3" transform="rotate(5 135 130)"/>

  <!-- 左臂（向左上方伸展，保持平衡） -->
  <g id="left-arm">
    <!-- 上臂 -->
    <line x1="110" y1="115" x2="50" y2="70" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
    <!-- 前臂 -->
    <line x1="50" y1="70" x2="20" y2="50" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
    <!-- 手（指向） -->
    <line x1="20" y1="50" x2="10" y2="40" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 右臂（向右后方伸展，保持平衡） -->
  <g id="right-arm">
    <!-- 上臂 -->
    <line x1="160" y1="120" x2="220" y2="100" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
    <!-- 前臂（向后） -->
    <line x1="220" y1="100" x2="250" y2="110" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
    <!-- 手（握拳） -->
    <circle cx="255" cy="112" r="6" fill="#000000"/>
  </g>

  <!-- 头部（低头专注看板） -->
  <circle cx="135" cy="75" r="35" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>

  <!-- 眼睛（专注向下） -->
  <circle cx="125" cy="78" r="4" fill="#000000"/>
  <circle cx="145" cy="78" r="4" fill="#000000"/>

  <!-- 嘴巴（专注的表情，小嘴） -->
  <line x1="130" y1="88" x2="140" y2="88" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

  <!-- 速度线/风线（表达动感） -->
  <g id="motion-lines" opacity="0.3">
    <line x1="200" y1="80" x2="240" y2="75" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
    <line x1="205" y1="100" x2="250" y2="95" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
    <line x1="210" y1="120" x2="255" y2="115" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
