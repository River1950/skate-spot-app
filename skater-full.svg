<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- 简笔画小人 完整形态 - 简单动态滑行 -->

  <!-- 简单的风线（表达速度感） -->
  <g id="speed-lines" opacity="0.2">
    <line x1="280" y1="120" x2="320" y2="120" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <line x1="290" y1="145" x2="335" y2="145" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <line x1="300" y1="170" x2="345" y2="170" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 滑行轨迹线 -->
  <path d="M 30 220 Q 100 215 180 220" stroke="#E5E5E5" stroke-width="2" stroke-dasharray="5,5" fill="none"/>

  <!-- 滑板 -->
  <g id="skateboard" transform="rotate(-5 150 220)">
    <!-- 滑板面 -->
    <rect x="90" y="210" width="120" height="12" rx="6" fill="#FF3B30" stroke="#000000" stroke-width="2"/>
    <!-- 左轮（运动模糊）-->
    <circle cx="110" cy="222" r="8" fill="#000000" opacity="0.6"/>
    <circle cx="112" cy="222" r="8" fill="#000000" opacity="0.4"/>
    <!-- 右轮 -->
    <circle cx="190" cy="222" r="8" fill="#000000" opacity="0.6"/>
    <circle cx="192" cy="222" r="8" fill="#000000" opacity="0.4"/>
  </g>

  <!-- 后腿 -->
  <line x1="155" y1="180" x2="170" y2="210" stroke="#000000" stroke-width="8" stroke-linecap="round"/>

  <!-- 前腿 -->
  <line x1="135" y1="180" x2="125" y2="210" stroke="#000000" stroke-width="8" stroke-linecap="round"/>

  <!-- 身体 - 圆形，前倾 -->
  <circle cx="145" cy="140" r="30" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>

  <!-- 后臂（向后摆动） -->
  <line x1="165" y1="135" x2="210" y2="145" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  <line x1="210" y1="145" x2="245" y2="140" stroke="#000000" stroke-width="7" stroke-linecap="round"/>

  <!-- 前臂（向前伸展） -->
  <line x1="125" y1="135" x2="85" y2="120" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  <line x1="85" y1="120" x2="55" y2="115" stroke="#000000" stroke-width="7" stroke-linecap="round"/>

  <!-- 头部 - 圆形 -->
  <circle cx="145" cy="90" r="35" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>

  <!-- 眼睛 - 专注的表情 -->
  <circle cx="135" cy="85" r="4" fill="#000000"/>
  <circle cx="155" cy="85" r="4" fill="#000000"/>

  <!-- 嘴巴 - 专注小嘴 -->
  <line x1="140" y1="100" x2="150" y2="100" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
</svg>
