<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- 简笔画小人 Logo 形态 - 极简圆形头像 -->

  <!-- 背景圆（黑色，用于PWA图标） -->
  <circle cx="100" cy="100" r="95" fill="#000000"/>

  <!-- 头部 - 白色圆形 -->
  <circle cx="100" cy="100" r="60" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>

  <!-- 左眼 - 简单黑点 -->
  <circle cx="85" cy="95" r="6" fill="#000000"/>

  <!-- 右眼 - 简单黑点 -->
  <circle cx="115" cy="95" r="6" fill="#000000"/>

  <!-- 嘴巴 - 简单弧线微笑 -->
  <path d="M 80 115 Q 100 125 120 115" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
