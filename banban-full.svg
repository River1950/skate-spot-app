<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <!-- 板板 完整形态 - 滑行姿势 -->

  <!-- 简单的城市剪影背景（可选） -->
  <g id="city-silhouette" opacity="0.1">
    <rect x="50" y="280" width="40" height="100" fill="#000000"/>
    <rect x="120" y="250" width="50" height="130" fill="#000000"/>
    <rect x="200" y="260" width="45" height="120" fill="#000000"/>
    <rect x="280" y="240" width="60" height="140" fill="#000000"/>
    <rect x="370" y="270" width="40" height="110" fill="#000000"/>
  </g>

  <!-- 滑行轨迹线（动感） -->
  <path d="M 50 320 Q 150 315 250 320" stroke="#E5E5E5" stroke-width="2" stroke-dasharray="5,5" fill="none"/>

  <!-- 滑板 -->
  <g id="skateboard" transform="rotate(-5 250 320)">
    <!-- 滑板面 -->
    <rect x="180" y="310" width="140" height="15" rx="7" fill="#FF3B30" stroke="#000000" stroke-width="2"/>
    <!-- 左轮（模糊效果表示运动） -->
    <circle cx="200" cy="325" r="10" fill="#000000" opacity="0.7"/>
    <circle cx="202" cy="325" r="10" fill="#000000" opacity="0.5"/>
    <!-- 右轮 -->
    <circle cx="300" cy="325" r="10" fill="#000000" opacity="0.7"/>
    <circle cx="302" cy="325" r="10" fill="#000000" opacity="0.5"/>
  </g>

  <!-- 身体 - 前倾滑行姿势 -->
  <ellipse cx="250" cy="240" rx="45" ry="55" fill="#FFFFFF" stroke="#000000" stroke-width="3" transform="rotate(-10 250 240)"/>

  <!-- 左臂（向前伸展保持平衡） -->
  <g id="left-arm">
    <line x1="220" y1="230" x2="170" y2="210" stroke="#000000" stroke-width="10" stroke-linecap="round"/>
    <line x1="170" y1="210" x2="140" y2="200" stroke="#000000" stroke-width="10" stroke-linecap="round"/>
    <circle cx="135" cy="200" r="10" fill="#000000"/>
  </g>

  <!-- 右臂（向后摆动） -->
  <g id="right-arm">
    <line x1="275" y1="235" x2="310" y2="250" stroke="#000000" stroke-width="10" stroke-linecap="round"/>
    <line x1="310" y1="250" x2="340" y2="255" stroke="#000000" stroke-width="10" stroke-linecap="round"/>
    <circle cx="345" cy="255" r="10" fill="#000000"/>
  </g>

  <!-- 头部 -->
  <circle cx="250" cy="180" r="50" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>

  <!-- 耳朵 -->
  <circle cx="222" cy="140" r="16" fill="#000000"/>
  <circle cx="278" cy="140" r="16" fill="#000000"/>

  <!-- 眼睛 - 专注的表情 -->
  <ellipse cx="235" cy="175" rx="14" ry="20" fill="#000000"/>
  <ellipse cx="265" cy="175" rx="14" ry="20" fill="#000000"/>

  <!-- 眼睛高光 -->
  <ellipse cx="238" cy="170" rx="4" ry="6" fill="#FFFFFF"/>
  <ellipse cx="268" cy="170" rx="4" ry="6" fill="#FFFFFF"/>

  <!-- 鼻子 -->
  <circle cx="250" cy="190" r="6" fill="#000000"/>

  <!-- 嘴巴 - 专注的小嘴 -->
  <path d="M 242 200 Q 250 203 258 200" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 左腿（弯曲蹲姿） -->
  <g id="left-leg">
    <line x1="235" y1="290" x2="220" y2="310" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- 右腿（伸展） -->
  <g id="right-leg">
    <line x1="260" y1="290" x2="280" y2="315" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- 运动风线（表达速度感） -->
  <g id="speed-lines" opacity="0.3">
    <line x1="350" y1="180" x2="380" y2="180" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
    <line x1="355" y1="200" x2="390" y2="200" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
    <line x1="360" y1="220" x2="395" y2="220" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
