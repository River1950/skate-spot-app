<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- 板板 Logo 形态 - 圆形头像 -->

  <!-- 背景圆（可选，用于PWA图标） -->
  <circle cx="100" cy="100" r="95" fill="#000000"/>

  <!-- 脸部 - 白色圆形 -->
  <circle cx="100" cy="100" r="70" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>

  <!-- 左耳 - 黑色圆形 -->
  <circle cx="65" cy="55" r="20" fill="#000000"/>

  <!-- 右耳 - 黑色圆形 -->
  <circle cx="135" cy="55" r="20" fill="#000000"/>

  <!-- 左眼 - 黑色椭圆 -->
  <ellipse cx="80" cy="95" rx="18" ry="25" fill="#000000"/>

  <!-- 右眼 - 黑色椭圆 -->
  <ellipse cx="120" cy="95" rx="18" ry="25" fill="#000000"/>

  <!-- 左眼内白色高光（让眼神更生动） -->
  <ellipse cx="83" cy="90" rx="6" ry="8" fill="#FFFFFF"/>

  <!-- 右眼内白色高光 -->
  <ellipse cx="123" cy="90" rx="6" ry="8" fill="#FFFFFF"/>

  <!-- 鼻子 - 小黑圆 -->
  <circle cx="100" cy="115" r="8" fill="#000000"/>

  <!-- 嘴巴 - 简单弧线微笑 -->
  <path d="M 85 125 Q 100 135 115 125" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
